<div style="margin:0;padding:30px 12px;background:#f3f6fb;font-family:Arial,Helvetica,sans-serif;color:#172033;">
  <div style="max-width:600px;margin:auto;">
    <div style="text-align:center;margin-bottom:22px;">
      <div style="font-size:24px;font-weight:700;color:#2563eb;">LMS</div>
      <div style="margin-top:5px;font-size:13px;color:#64748b;">Library Management System</div>
    </div>
    <div style="background:#fff;border:1px solid #e5eaf2;border-radius:14px;overflow:hidden;">
      <div style="padding:28px 24px;background:#eff6ff;text-align:center;">
        <div style="font-size:11px;font-weight:bold;color:#1d4ed8;">LIBRARY ACCOUNT</div>
        <h1 style="font-size:25px;line-height:1.35;margin:16px 0 8px;">{{subject}}</h1>
      </div>
      <div style="padding:26px;font-size:15px;line-height:1.8;">{{{message_html}}}</div>
      <div style="padding:18px 26px;background:#f8fafc;font-size:12px;line-height:1.7;color:#64748b;">Keep account credentials private. Contact your library administrator if you did not expect this email.</div>
    </div>
    <div style="text-align:center;padding:22px 10px;font-size:12px;line-height:1.8;color:#94a3b8;">LMS · Library Management System<br>Automated library notification</div>
  </div>
</div>
