services:
  app:
    build:
      context: .
      target: development

    container_name: nest-dev

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    env_file:
      - .env

    environment:
      - NODE_ENV=development
      - PORT=3000
      - PNPM_CONFIRM_MODULES_PURGE=false
      - CI=true
    command: pnpm run start:dev
